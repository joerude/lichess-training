<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Шахматный журнал</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="popup.js"></script>
</head>
<body class="popup-body">
  <main class="popup-shell">
    <header class="popup-header"><img src="../icons/training.svg" width="34" height="34" alt=""><div><h1>Шахматный журнал</h1><p id="username" class="caption">sebajun777</p></div><button id="refresh" class="button button-quiet popup-refresh" type="button" aria-label="Обновить журнал">↻</button></header>
    <div id="error" class="message message-error" role="alert" hidden></div><p id="notice" class="message message-success" role="status" hidden></p>
    <section id="program-card" class="card popup-program" aria-label="Ежедневная программа" aria-busy="true"><p class="eyebrow">ПРОГРАММА СЕГОДНЯ</p><p id="program-summary" role="status">Загрузка…</p><p id="program-error" class="message message-error" role="alert" hidden></p></section>
    <section id="today-card" class="card popup-card" aria-labelledby="popup-today" aria-busy="true"><div class="card-top"><p id="popup-today" class="eyebrow">СЕГОДНЯ</p><time id="today-date">Загрузка…</time></div><p class="task-target"><span id="puzzle-solved" hidden></span><span id="target">—</span> <span class="target-unit">задач</span></p><p class="muted">Ежедневная тактика на Lichess</p><div id="puzzle-progress" class="puzzle-progress" hidden><progress id="puzzle-bar" max="10" value="0" aria-label="Решено задач сегодня"></progress><p id="puzzle-phrase" class="puzzle-phrase" role="status"></p><p id="puzzle-meta" class="caption"></p></div><p id="today-status" class="task-status" role="status">Загружаем журнал…</p><a class="button button-primary" href="https://lichess.org/training" target="_blank" rel="noopener noreferrer">Открыть задачи ↗<span class="sr-only"> (в новой вкладке)</span></a><button id="completion" class="button button-secondary" type="button" aria-pressed="false" disabled>Отметить выполнение</button></section>
    <button id="open-dashboard" class="button dashboard-link" type="button">Открыть полный журнал <span aria-hidden="true">→</span></button><p class="caption popup-caption">Автоподсчёт по профилю Lichess · Время Бишкека</p>
  </main>
</body>
</html>
